<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스펙트럼 라이트 이펙트</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow-x: hidden;
            font-family: 'Arial', sans-serif;
        }

        .spectrum-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
        }

        .spectrum-light {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 800px;
            height: 800px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(
                circle,
                rgba(255, 0, 150, 0.3) 0%,
                rgba(0, 255, 255, 0.2) 25%,
                rgba(255, 255, 0, 0.2) 50%,
                rgba(150, 0, 255, 0.1) 75%,
                transparent 100%
            );
            filter: blur(40px);
            animation: pulse 4s ease-in-out infinite alternate;
        }

        .spectrum-light::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(
                from 0deg,
                #ff0080,
                #00ffff,
                #ffff00,
                #8000ff,
                #ff4000,
                #00ff80,
                #ff0080
            );
            border-radius: 50%;
            opacity: 0.1;
            filter: blur(60px);
            animation: rotate 20s linear infinite;
        }

        .spectrum-light::after {
            content: '';
            position: absolute;
            top: 20%;
            left: 20%;
            width: 60%;
            height: 60%;
            background: radial-gradient(
                circle,
                rgba(255, 255, 255, 0.1) 0%,
                rgba(255, 255, 255, 0.05) 30%,
                transparent 70%
            );
            border-radius: 50%;
            filter: blur(20px);
        }

        .content {
            position: relative;
            z-index: 2;
            min-height: 400vh;
            padding: 100px 50px;
        }

        .section {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.8);
            font-size: 2rem;
            text-align: center;
            backdrop-filter: blur(5px);
            border-radius: 20px;
            margin: 50px 0;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        @keyframes pulse {
            0% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.6;
            }
            100% {
                transform: translate(-50%, -50%) scale(1.2);
                opacity: 0.3;
            }
        }

        @keyframes rotate {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* 스크롤에 따른 색상 변화를 위한 CSS 변수 */
        :root {
            --hue: 0;
            --saturation: 80%;
            --lightness: 60%;
        }

        .spectrum-light.scroll-active {
            background: radial-gradient(
                circle,
                hsla(var(--hue), var(--saturation), var(--lightness), 0.3) 0%,
                hsla(calc(var(--hue) + 60), var(--saturation), var(--lightness), 0.2) 25%,
                hsla(calc(var(--hue) + 120), var(--saturation), var(--lightness), 0.2) 50%,
                hsla(calc(var(--hue) + 180), var(--saturation), var(--lightness), 0.1) 75%,
                transparent 100%
            );
            transition: background 0.3s ease;
        }

        .spectrum-light.scroll-active::before {
            background: conic-gradient(
                from 0deg,
                hsl(var(--hue), var(--saturation), var(--lightness)),
                hsl(calc(var(--hue) + 60), var(--saturation), var(--lightness)),
                hsl(calc(var(--hue) + 120), var(--saturation), var(--lightness)),
                hsl(calc(var(--hue) + 180), var(--saturation), var(--lightness)),
                hsl(calc(var(--hue) + 240), var(--saturation), var(--lightness)),
                hsl(calc(var(--hue) + 300), var(--saturation), var(--lightness)),
                hsl(var(--hue), var(--saturation), var(--lightness))
            );
            transition: background 0.3s ease;
        }

        /* 추가 라이트 이펙트 */
        .light-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        .particle:nth-child(1) { top: 20%; left: 10%; animation-delay: 0s; }
        .particle:nth-child(2) { top: 80%; left: 20%; animation-delay: 1s; }
        .particle:nth-child(3) { top: 40%; left: 80%; animation-delay: 2s; }
        .particle:nth-child(4) { top: 70%; left: 70%; animation-delay: 3s; }
        .particle:nth-child(5) { top: 30%; left: 50%; animation-delay: 4s; }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px) scale(1);
                opacity: 0.3;
            }
            50% {
                transform: translateY(-20px) scale(1.2);
                opacity: 0.8;
            }
        }
    </style>
</head>
<body>
    <div class="spectrum-container">
        <div class="spectrum-light" id="spectrumLight"></div>
    </div>

    <div class="light-particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <div class="content">
        <div class="section">
            <h1>스펙트럼 라이트 이펙트</h1>
        </div>
        <div class="section">
            <p>스크롤을 내려보세요<br>색상이 은은하게 변화합니다</p>
        </div>
        <div class="section">
            <p>무지개 빛깔의 그라디언트가<br>부드럽게 흘러갑니다</p>
        </div>
        <div class="section">
            <p>검은 배경 위에서<br>스펙트럼이 춤을 춥니다</p>
        </div>
    </div>

    <script>
        const spectrumLight = document.getElementById('spectrumLight');
        const root = document.documentElement;
        
        // 스크롤 이벤트 리스너
        window.addEventListener('scroll', () => {
            const scrollPercent = window.scrollY / (document.documentElement.scrollHeight - window.innerHeight);
            
            // 0부터 360까지의 색조값 계산
            const hue = Math.floor(scrollPercent * 360);
            
            // CSS 변수 업데이트
            root.style.setProperty('--hue', hue);
            
            // 스크롤 활성화 클래스 추가
            spectrumLight.classList.add('scroll-active');
            
            // 스크롤 위치에 따른 추가 효과
            const intensity = 0.3 + (scrollPercent * 0.4); // 0.3 ~ 0.7
            const blur = 40 + (scrollPercent * 20); // 40px ~ 60px
            
            spectrumLight.style.filter = `blur(${blur}px)`;
            spectrumLight.style.opacity = intensity;
        });

        // 페이지 로드 시 초기 설정
        window.addEventListener('load', () => {
            spectrumLight.classList.add('scroll-active');
        });

        // 마우스 움직임에 따른 미묘한 효과
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) * 100;
            const y = (e.clientY / window.innerHeight) * 100;
            
            spectrumLight.style.transform = `translate(calc(-50% + ${(x - 50) * 0.1}px), calc(-50% + ${(y - 50) * 0.1}px))`;
        });
    </script>
</body>
</html>
